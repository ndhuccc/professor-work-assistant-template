name: Course checks

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-site.txt
      - run: python scripts/check_slides.py
      - run: python scripts/build_docs.py
      - run: python -m mkdocs build --strict
