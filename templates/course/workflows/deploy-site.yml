name: Deploy course site

# Only run after the teacher enables Pages and explicitly starts this workflow.
# Add a push trigger for main only after automatic deployment is approved.
'on':
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: course-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-site.txt
      - uses: actions/configure-pages@v5
      - run: python scripts/check_slides.py
      - run: python scripts/build_docs.py
      - run: python -m mkdocs build --strict
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
